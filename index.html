<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="大模型面试备战知识库：Agent 开发 / AI Infra 方向，含 JD 分析、高频考点、手撕题、系统设计与推理引擎源码解读。">
  <title>offer-is-all-you-need · 大模型面试知识库</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">正在加载知识库…</div>
  <script>
    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    window.$docsify = {
      name: '<b>offer-is-all-you-need</b>',
      nameLink: 'https://github.com/backtraxe/offer-is-all-you-need',
      repo: 'backtraxe/offer-is-all-you-need',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索知识库…',
        noData: '没有找到相关内容',
        depth: 6
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + esc(code) + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var els = document.querySelectorAll('.mermaid:not([data-processed])');
            if (els.length && window.mermaid) {
              mermaid.run({ nodes: els }).catch(function (e) {
                console.warn('mermaid render:', e);
              });
            }
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'default' });
  </script>
</body>
</html>
